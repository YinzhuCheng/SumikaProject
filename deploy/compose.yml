services:
  sumika-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sumika-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PERSONA_CONFIG=/app/config/persona.yml
      - DATA_DIR=/app/data
      - ASSETS_DIR=/app/assets
      - OPENROUTER_API_KEY_FILE=/run/secrets/openrouter_key
      - ADVANCED_MEMORY_ENABLED=${ADVANCED_MEMORY_ENABLED:-false}
      - MEMMACHINE_URL=${MEMMACHINE_URL:-http://memmachine:8080}
      - GRAPHITI_URL=${GRAPHITI_URL:-http://graphiti:8000}
      - COGNEE_URL=${COGNEE_URL:-http://cognee:8000}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ../config:/app/config:ro
      - ../assets:/app/assets
      - ../roles:/app/roles:ro
      - ../data:/app/data
      - ../secrets/openrouter_key:/run/secrets/openrouter_key:ro

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - NAPCAT_UID=${NAPCAT_UID:-1000}
      - NAPCAT_GID=${NAPCAT_GID:-1000}
    ports:
      - "127.0.0.1:6099:6099"
      - "127.0.0.1:3001:3001"
    volumes:
      - ../data/napcat/qq:/app/.config/QQ
      - ../data/napcat/config:/app/napcat/config
      - ../data/napcat/plugins:/app/napcat/plugins
    depends_on:
      - sumika-agent

  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: unless-stopped
    profiles:
      - astrbot
    ports:
      - "127.0.0.1:6185:6185"
    volumes:
      - ../data/astrbot:/AstrBot/data

  neo4j:
    image: neo4j:5-community
    container_name: sumika-neo4j
    restart: unless-stopped
    profiles:
      - advanced-memory
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/sumika-local-dev}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1024m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - ../data/neo4j:/data

  postgres:
    image: postgres:16-alpine
    container_name: sumika-postgres
    restart: unless-stopped
    profiles:
      - advanced-memory
    environment:
      - POSTGRES_DB=${SUMIKA_POSTGRES_DB:-sumika_memory}
      - POSTGRES_USER=${SUMIKA_POSTGRES_USER:-sumika}
      - POSTGRES_PASSWORD=${SUMIKA_POSTGRES_PASSWORD:-sumika-local-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data

  memmachine:
    build:
      context: ../vendor/upstream/memmachine
    container_name: sumika-memmachine
    restart: unless-stopped
    profiles:
      - advanced-memory
    environment:
      - MEMORY_CONFIG=/app/configuration.yml
      - HOST=0.0.0.0
      - PORT=8080
      - POSTGRES_PASSWORD=${SUMIKA_POSTGRES_PASSWORD:-sumika-local-dev}
      - NEO4J_PASSWORD=${SUMIKA_NEO4J_PASSWORD:-sumika-local-dev}
      - OPENAI_BASE_URL=${MEMORY_LLM_BASE_URL:-https://api.deepseek.com}
      - OPENAI_API_KEY=${MEMORY_LLM_API_KEY:-}
      - OPENAI_MODEL=${MEMORY_LLM_MODEL:-deepseek-v4-pro}
    volumes:
      - ./memmachine/configuration.yml:/app/configuration.yml:ro
      - ../data/memmachine:/app/data
    depends_on:
      - neo4j
      - postgres

  graphiti:
    build:
      context: ../vendor/upstream/graphiti
    container_name: sumika-graphiti
    restart: unless-stopped
    profiles:
      - advanced-memory
    environment:
      - OPENAI_BASE_URL=${MEMORY_LLM_BASE_URL:-https://api.deepseek.com}
      - OPENAI_API_KEY=${MEMORY_LLM_API_KEY:-sumika-smoke-disabled}
      - MODEL_NAME=${MEMORY_LLM_MODEL:-deepseek-v4-pro}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${SUMIKA_NEO4J_PASSWORD:-sumika-local-dev}
    depends_on:
      - neo4j

  cognee:
    build:
      context: ../vendor/upstream/cognee
    container_name: sumika-cognee
    restart: unless-stopped
    profiles:
      - advanced-memory
    environment:
      - ENVIRONMENT=local
      - DEBUG=false
      - ENABLE_BACKEND_ACCESS_CONTROL=false
      - DATA_ROOT_DIRECTORY=/app/data/storage
      - SYSTEM_ROOT_DIRECTORY=/app/data/system
      - CACHE_ROOT_DIRECTORY=/app/data/cache
      - COGNEE_LOGS_DIR=/app/data/logs
      - OPENAI_BASE_URL=${MEMORY_LLM_BASE_URL:-https://api.deepseek.com}
      - OPENAI_API_KEY=${MEMORY_LLM_API_KEY:-}
      - LLM_MODEL=${MEMORY_LLM_MODEL:-deepseek-v4-pro}
      - DB_PROVIDER=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${SUMIKA_POSTGRES_USER:-sumika}
      - DB_PASSWORD=${SUMIKA_POSTGRES_PASSWORD:-sumika-local-dev}
      - DB_NAME=${SUMIKA_POSTGRES_DB:-sumika_memory}
      - MIGRATION_DB_PROVIDER=postgres
      - MIGRATION_DB_HOST=postgres
      - MIGRATION_DB_PORT=5432
      - MIGRATION_DB_USERNAME=${SUMIKA_POSTGRES_USER:-sumika}
      - MIGRATION_DB_PASSWORD=${SUMIKA_POSTGRES_PASSWORD:-sumika-local-dev}
      - MIGRATION_DB_NAME=${SUMIKA_POSTGRES_DB:-sumika_memory}
      - GRAPH_DATABASE_PROVIDER=neo4j
      - GRAPH_DATABASE_URL=bolt://neo4j:7687
      - GRAPH_DATABASE_HOST=neo4j
      - GRAPH_DATABASE_PORT=7687
      - GRAPH_DATABASE_USERNAME=neo4j
      - GRAPH_DATABASE_PASSWORD=${SUMIKA_NEO4J_PASSWORD:-sumika-local-dev}
    volumes:
      - ../data/cognee:/app/data
    depends_on:
      - postgres
      - neo4j
